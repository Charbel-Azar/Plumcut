<!doctype html>
<meta charset="utf-8">
<title>plumcut hero library</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; background: #faf6fb; color: #481D52; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  p.lede { opacity: .7; margin: 0 0 2rem; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
  figure { margin: 0; background: #fff; border: 1px solid rgba(72,29,82,.14); border-radius: 14px; overflow: hidden; }
  /* same crop the hero uses: object-fit cover in a wide band */
  .crop { height: 190px; background: #f2ecf4; }
  .crop img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { padding: .8rem 1rem 1rem; display: flex; flex-direction: column; gap: .3rem; }
  code { font-size: .78rem; color: #E65E04; }
  .alt { font-size: .9rem; }
  .tags { font-size: .75rem; opacity: .6; }
  .cred { font-size: .72rem; opacity: .5; }
</style>
<h1>plumcut hero library</h1>
<p class="lede">Every image cropped exactly the way a blog hero renders, so this is what actually ships.
Delete anything that does not look right, then remove its entry from <code>manifest.json</code>.</p>
